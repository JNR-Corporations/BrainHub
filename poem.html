<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Poem Hub - Brain Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="../../../../manifest.json">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121722" media="(prefers-color-scheme: dark)">

    <style>
        :root {
            --bg: #eef3f8;
            --panel: rgba(251, 253, 255, 0.85);
            --panel-solid: #fbfdff;
            --panel-2: #f5f8fb;
            --text: #17202a;
            --muted: #657282;
            --line: rgba(26, 42, 58, 0.08);
            --primary: #2563eb;
            --primary-light: rgba(37, 99, 235, 0.06);
            --shadow: 0 16px 36px rgba(31, 45, 61, 0.05);
            --radius: 16px;
            --radius-sm: 12px;
            --nav-h: 56px;
            
            /* Poem Specific Adaptive Colors */
            --poem-odd: #17202a;
            --poem-even: #2563eb;
        }

        [data-theme="dark"] {
            --bg: #121722;
            --panel: rgba(26, 34, 48, 0.85);
            --panel-solid: #1a2230;
            --panel-2: #111827;
            --text: #edf2f7;
            --muted: #9aa8ba;
            --line: rgba(255, 255, 255, 0.06);
            --primary: #60a5fa;
            --primary-light: rgba(96, 165, 250, 0.1);
            --shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
            
            /* Dark Mode Poem Text colors */
            --poem-odd: #edf2f7;
            --poem-even: #60a5fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            padding-bottom: calc(30px + env(safe-area-inset-bottom));
        }

        nav {
            height: calc(var(--nav-h) + env(safe-area-inset-top));
            background: var(--panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: flex-end;
            padding-top: env(safe-area-inset-top);
            padding-bottom: 11px;
            padding-left: calc(16px + env(safe-area-inset-left));
            padding-right: calc(16px + env(safe-area-inset-right));
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .back-link {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--panel-2);
            border: 1px solid var(--line);
            color: var(--text);
            display: grid;
            place-items: center;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .nav-left h1 {
            font-size: 16px;
            font-weight: 800;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 12px;
            padding-left: calc(12px + env(safe-area-inset-left));
            padding-right: calc(12px + env(safe-area-inset-right));
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .chapter-hero {
            background: var(--panel-solid);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 20px 16px;
            box-shadow: var(--shadow);
        }

        .meta-badge {
            display: inline-block;
            padding: 3px 8px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 10px;
            font-weight: 700;
            border-radius: 30px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .chapter-hero h2 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .panel {
            background: var(--panel-solid);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 16px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 8px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title i {
            font-size: 14px;
            color: var(--primary);
        }

        .panel-title h3 {
            font-size: 14.5px;
            font-weight: 800;
        }

        .lang-switch-box {
            display: flex;
            background: var(--panel-2);
            padding: 2px;
            border-radius: 30px;
            border: 1px solid var(--line);
        }

        .lang-btn {
            background: none;
            border: none;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: var(--primary);
            color: #ffffff;
        }

        /* Poem Arena Styling */
        .poem-content-box {
            text-align: center;
            padding: 10px 0;
        }

        .poem-stanza {
            margin-bottom: 24px;
        }

        .poem-line {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.8;
            margin-bottom: 4px;
            letter-spacing: 0.2px;
        }

        /* Alternative Colors for Lines */
        .poem-line:nth-child(odd) {
            color: var(--poem-odd);
        }

        .poem-line:nth-child(even) {
            color: var(--poem-even);
            font-style: italic;
        }

        /* Central Idea Area */
        .central-idea-text {
            font-size: 13.5px;
            line-height: 1.6;
            color: var(--text);
            text-align: justify;
        }

        .writer-badge {
            margin-top: 12px;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        * {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>

<body>

    <nav>
        <div class="nav-left">
            <a href="../../home.html" class="back-link"><i class="fa-solid fa-arrow-left"></i></a>
            <h1>Poetry Library</h1>
        </div>
    </nav>

    <div class="container">

        <div class="chapter-hero">
            <span class="meta-badge">Class 9 • Poem 01 • Verse</span>
            <h2 id="poemTitle">The Road Not Taken</h2>
            <div class="writer-badge"><i class="fa-solid fa-pen-nib"></i> By Robert Frost</div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <i class="fa-solid fa-music"></i>
                    <h3>Poem Verses</h3>
                </div>
            </div>
            <div class="poem-content-box" id="poemVersesRoot">
                </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <i class="fa-solid fa-lightbulb"></i>
                    <h3>Central Idea</h3>
                </div>
                <div class="lang-switch-box">
                    <button class="lang-btn active" onclick="switchCentralIdeaLanguage('en', this)">English</button>
                    <button class="lang-btn" onclick="switchCentralIdeaLanguage('hi', this)">हिंदी</button>
                </div>
            </div>
            <div class="central-idea-text" id="centralIdeaRoot">
                </div>
        </div>

    </div>

    <script>
        // ==========================================
        // DYNAMIC REPOSITORY FOR POEM
        // ==========================================
        const poemDataAsset = {
            title: "The Road Not Taken",
            author: "Robert Frost",
            stanzas: [
                [
                    "Two roads diverged in a yellow wood,",
                    "And sorry I could not travel both",
                    "And be one traveler, long I stood",
                    "And looked down one far as I could",
                    "To where it bent in the undergrowth;"
                ],
                [
                    "Then took the other, as just as fair,",
                    "And having perhaps the better claim,",
                    "Because it was grassy and wanted wear;",
                    "Though as for that the passing there",
                    "Had worn them really about the same,"
                ]
            ],
            centralIdea: {
                en: "The central idea of the poem revolves around the choices that we make in our lives and how they shape our destiny. Frost uses the metaphor of two diverging roads in a forest to represent the critical decision points where individuals must select one path over another, permanently impacting their future journeys.",
                hi: "इस कविता का केंद्रीय विचार हमारे जीवन में किए जाने वाले विकल्पों (choices) और वे हमारे भाग्य को कैसे आकार देते हैं, इसके इर्द-गिर्द घूमता है। फ्रॉस्ट जंगल में दो अलग होने वाली सड़कों के रूपक (metaphor) का उपयोग करके उन महत्वपूर्ण निर्णय बिंदुओं को दर्शाते हैं जहां व्यक्तियों को एक रास्ते को दूसरे पर चुनना होता है, जो उनके भविष्य की यात्रा को हमेशा के लिए प्रभावित करता है।"
            }
        };

        // ==========================================
        // DYNAMIC DOM INJECTION INJECTOR
        // ==========================================
        function loadPoemEngine() {
            // Set Header fields
            document.getElementById("poemTitle").textContent = poemDataAsset.title;
            
            // Default Central Idea Language Setup
            switchCentralIdeaLanguage('en', null);

            // Render Stanzas with Alternative Color Architecture
            const versesRoot = document.getElementById("poemVersesRoot");
            let htmlBuffer = "";

            poemDataAsset.stanzas.forEach((stanza) => {
                htmlBuffer += `<div class="poem-stanza">`;
                stanza.forEach((line) => {
                    htmlBuffer += `<div class="poem-line">${line}</div>`;
                });
                htmlBuffer += `</div>`;
            });

            versesRoot.innerHTML = htmlBuffer;
        }

        // Language Switch Controller for Central Idea
        function switchCentralIdeaLanguage(langKey, elementRef) {
            if (elementRef) {
                const siblingBtns = elementRef.parentElement.querySelectorAll(".lang-btn");
                siblingBtns.forEach(btn => btn.classList.remove("active"));
                elementRef.classList.add("active");
            }
            document.getElementById("centralIdeaRoot").innerHTML = poemDataAsset.centralIdea[langKey] || poemDataAsset.centralIdea['en'];
        }

        // ==========================================
        // LOCAL THEME COUPLING CONTROLLER
        // ==========================================
        function applyThemeFromBrainHub() {
            const data = JSON.parse(localStorage.getItem("brainhub.app.v2") || "{}");
            const theme = data.theme || "light";
            document.documentElement.dataset.theme = theme;
            const metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.setAttribute("content", theme === "dark" ? "#121722" : "#ffffff");
        }

        // Init App Loop
        document.addEventListener("DOMContentLoaded", () => {
            loadPoemEngine();
            applyThemeFromBrainHub();
        });

        // Live syncing fallback 
        setInterval(applyThemeFromBrainHub, 500);
    </script>
</body>

</html>
