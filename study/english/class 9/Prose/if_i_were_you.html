<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>If I Were You - Brain Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="manifest" href="../../../../manifest.json">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121722" media="(prefers-color-scheme: dark)">

    <style>
        :root {
            --bg: #eef3f8;
            --panel: rgba(251, 253, 255, 0.85);
            --panel-solid: #fbfdff;
            --panel-2: #f5f8fb;
            --text: #17202a;
            --muted: #657282;
            --line: rgba(26, 42, 58, 0.08);
            --primary: #2563eb;
            --primary-light: rgba(37, 99, 235, 0.06);
            --shadow: 0 16px 36px rgba(31, 45, 61, 0.05);
            --radius: 16px;
            --radius-sm: 12px;
            --nav-h: 56px;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-orange: #f59e0b;
        }

        [data-theme="dark"] {
            --bg: #121722;
            --panel: rgba(26, 34, 48, 0.85);
            --panel-solid: #1a2230;
            --panel-2: #111827;
            --text: #edf2f7;
            --muted: #9aa8ba;
            --line: rgba(255, 255, 255, 0.06);
            --primary: #60a5fa;
            --primary-light: rgba(96, 165, 250, 0.1);
            --shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            /* Immersive Bottom status/gesture safe layout calculation */
            padding-bottom: calc(30px + env(safe-area-inset-bottom));
        }

        /* Nav framework modified for full device top immersion */
        nav {
            height: calc(var(--nav-h) + env(safe-area-inset-top));
            background: var(--panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: flex-end;
            /* Notch areas ke safe side pe display handle karne ke liye */
            padding-top: env(safe-area-inset-top);
            padding-bottom: 11px;
            padding-left: calc(16px + env(safe-area-inset-left));
            padding-right: calc(16px + env(safe-area-inset-right));
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .back-link {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--panel-2);
            border: 1px solid var(--line);
            color: var(--text);
            display: grid;
            place-items: center;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .nav-left h1 {
            font-size: 16px;
            font-weight: 800;
        }

        /* Container fluid properties mapping landscape safe regions */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px;
            padding-left: calc(12px + env(safe-area-inset-left));
            padding-right: calc(12px + env(safe-area-inset-right));
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .chapter-hero {
            background: var(--panel-solid);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 20px 16px;
            box-shadow: var(--shadow);
        }

        .meta-badge {
            display: inline-block;
            padding: 3px 8px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 10px;
            font-weight: 700;
            border-radius: 30px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .chapter-hero h2 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .chapter-hero p {
            color: var(--muted);
            font-size: 12.5px;
            line-height: 1.45;
        }

        .panel {
            background: var(--panel-solid);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 8px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title i {
            font-size: 14px;
            color: var(--primary);
        }

        .panel-title h3 {
            font-size: 14.5px;
            font-weight: 800;
        }

        .lang-switch-box {
            display: flex;
            background: var(--panel-2);
            padding: 2px;
            border-radius: 30px;
            border: 1px solid var(--line);
        }

        .lang-btn {
            background: none;
            border: none;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: var(--primary);
            color: #ffffff;
        }

        .summary-content-area {
            font-size: 13.5px;
            line-height: 1.6;
            color: var(--text);
        }

        .summary-paragraph {
            margin-bottom: 10px;
            text-align: justify;
        }

        /* Quiz UI Layouts */
        .quiz-arena-box {
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 14px;
            min-height: 190px;
        }

        .quiz-meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .quiz-question-text {
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .quiz-options-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .quiz-opt-btn {
            background: var(--panel-solid);
            border: 1px solid var(--line);
            padding: 11px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }

        .quiz-opt-btn.correct-state {
            background: rgba(16, 185, 129, 0.12) !important;
            border-color: var(--accent-green) !important;
            color: var(--accent-green) !important;
        }

        .quiz-opt-btn.wrong-state {
            background: rgba(239, 68, 68, 0.12) !important;
            border-color: var(--accent-red) !important;
            color: var(--accent-red) !important;
        }

        .quiz-action-footer {
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quiz-feedback-banner {
            font-size: 12px;
            font-weight: 700;
        }

        .quiz-next-action-btn {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 7px 14px;
            border-radius: 30px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .quiz-score-layout {
            text-align: center;
            padding: 20px 10px;
        }

        .quiz-score-layout i {
            font-size: 32px;
            color: var(--accent-orange);
            margin-bottom: 10px;
        }

        /* Q&A Accordion Matrix */
        .qa-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .qa-card {
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 12px;
            cursor: pointer;
        }

        .qa-question {
            font-size: 13.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            line-height: 1.4;
        }

        .qa-question span {
            color: var(--primary);
            font-weight: 800;
        }

        .qa-answer {
            font-size: 12.5px;
            color: var(--muted);
            padding-left: 14px;
            border-left: 2px solid var(--primary);
            display: none;
            margin-top: 8px;
            animation: textFadeIn 0.2s ease-out;
            line-height: 1.5;
        }

        .qa-chevron {
            font-size: 11px;
            color: var(--muted);
            transition: transform 0.2s;
        }

        .qa-card.active-panel .qa-chevron {
            transform: rotate(180deg);
            color: var(--primary);
        }

        /* Fill in the Blanks */
        .fill-card-box {
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 14px;
        }

        .quiz-question {
            font-size: 13.5px;
            font-weight: 700;
        }

        .quiz-question span {
            color: var(--primary);
            margin-right: 4px;
        }

        .fill-row-alignment {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .fill-input {
            background: var(--panel-solid);
            border: 2px solid var(--line);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            flex: 1;
            outline: none;
            transition: border-color 0.2s;
        }

        .fill-input:focus {
            border-color: var(--primary);
        }

        .fill-reveal-btn {
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s;
        }

        /* Writer Biography */
        .writer-profile-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .writer-avatar-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: grid;
            place-items: center;
            font-size: 18px;
            border: 1px solid var(--line);
            flex-shrink: 0;
        }

        .writer-bio-text h4 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .writer-bio-text p {
            font-size: 12.5px;
            color: var(--muted);
            line-height: 1.5;
        }

        @media (min-width: 768px) {
            .container {
                padding: 20px;
                padding-left: calc(20px + env(safe-area-inset-left));
                padding-right: calc(20px + env(safe-area-inset-right));
                gap: 20px;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }

            .chapter-hero,
            .writer-panel,
            .summary-panel {
                grid-column: span 2;
            }

            .quiz-options-wrapper {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @keyframes textFadeIn {
            from {
                opacity: 0;
                transform: translateY(3px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        * {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>

                answer: "The main theme of the play is that intelligence, presence of mind, and quick thinking are more powerful than physical strength or violence."
            },
            {
                id: 10,

                answer: "The story takes place in Gerrard’s isolated cottage, which serves as both his home and workplace, making it the central setting of the play."
            },
            {

                answer: "The Intruder wants to kill Gerrard so that he can take his identity and use it as a disguise to escape from the police safely."
            },
            {
                id: 12,
                question: "What qualities of Gerrard help him survive?",
                answer: "Gerrard’s calm nature, intelligence, confidence, and quick decision-making help him survive the dangerous situation and outsmart the Intruder."
            },
            {
                id: 13,
                question: "What mistake does the Intruder make?",
                answer: "The Intruder underestimates Gerrard and believes he is weak. This mistake allows Gerrard to manipulate him and turn the situation in his favor."
            },
            {
                id: 14,
                question: "What is the role of presence of mind in the play?",
                answer: "Presence of mind plays a very important role as Gerrard uses his quick thinking to confuse the Intruder and escape danger without using violence."
            },
            {
                id: 15,
                question: "What lesson does the play teach?",
                answer: "The play teaches that intelligence and clever thinking are stronger than physical force. A calm mind can handle even the most dangerous situations successfully."
            }

        ];

        // About Writer Profile Object Asset
        const writerBiographyDataAsset = {
            name: "Douglas James Stewart",
            timeline: "(1893–1966)",
            biographyText: `
        Douglas James Stewart was an Australian playwright and author. He is best known for his contribution to modern drama and radio plays. His works often focus on suspense, intelligence, and psychological conflict between characters.<br><br>
        Stewart’s writing style is simple yet powerful, and he builds tension through dialogue and clever plot development. He had a strong command over dramatic storytelling, which makes his plays engaging and thought-provoking.<br><br>
        The play <i>“If I Were You”</i> is one of his well-known works. It highlights the importance of presence of mind and intelligence over physical strength through a suspenseful encounter between Gerrard and an Intruder.
    `
        };

        // Summary Multi-Lingual Asset Data
        const summaryDataAsset = {
            en: `<div class="summary-paragraph"><strong>Introduction:</strong> "If I Were You" is a one-act play written by Douglas James Stewart. It is a suspenseful story that highlights intelligence, presence of mind, and clever thinking in dangerous situations.</div>

         <div class="summary-paragraph"><strong>Storyline:</strong> The play revolves around Gerrard, a calm and intelligent playwright who lives alone in a cottage. One day, an Intruder enters his house with a gun. The Intruder plans to kill Gerrard and take his identity in order to escape from the police.</div>

         <div class="summary-paragraph"><strong>Conflict:</strong> The tension builds when Gerrard does not panic and instead uses his quick thinking to handle the situation. He pretends to be a criminal himself and confuses the Intruder with a clever story.</div>

         <div class="summary-paragraph"><strong>Climax:</strong> Using his intelligence, Gerrard successfully tricks the Intruder. When the Intruder believes him, Gerrard takes advantage of the situation and locks him in a cupboard, saving himself from danger.</div>

         <div class="summary-paragraph"><strong>Conclusion:</strong> The play teaches that intelligence, presence of mind, and calm behaviour are more powerful than physical strength or violence. Quick thinking can help overcome even life-threatening situations.</div>`,

            hi: `<div class="summary-paragraph"><strong>परिचय:</strong> "इफ आई वेयर यू" डगलस जेम्स स्टीवर्ट द्वारा लिखित एक एकांकी नाटक है, जो बुद्धिमत्ता और सूझबूझ के महत्व को दर्शाता है।</div>

         <div class="summary-paragraph"><strong>कहानी:</strong> इसमें गेरेर्ड नामक एक शांत और बुद्धिमान नाटककार होता है, जो अकेले एक कॉटेज में रहता है। एक दिन एक अपराधी (इंट्रूडर) उसके घर में बंदूक लेकर घुस आता है और उसे मारकर उसकी पहचान लेने की योजना बनाता है।</div>

         <div class="summary-paragraph"><strong>संघर्ष:</strong> गेरेर्ड घबराता नहीं है और अपनी सूझबूझ से स्थिति को संभालता है। वह खुद को भी अपराधी बताकर इंट्रूडर को भ्रमित करता है।</div>

         <div class="summary-paragraph"><strong>चरम:</strong> अपनी बुद्धिमत्ता से गेरेर्ड इंट्रूडर को धोखा देता है और उसे एक अलमारी में बंद कर देता है।</div>

         <div class="summary-paragraph"><strong>निष्कर्ष:</strong> यह नाटक सिखाता है कि शारीरिक शक्ति से ज्यादा बुद्धिमत्ता और शांत दिमाग अधिक शक्तिशाली होते हैं।</div>`
        };
        // Runtime Global State Counters
        let mcqActiveIndex = 0, mcqScoreCount = 0;
        let tfActiveIndex = 0, tfScoreCount = 0;

        // ==========================================
        // DYNAMIC ENGINES INJECTION GENERATORS (JS DOM Render)
        // ==========================================

        // 1. Dynamic Injection Generator for Fill in the Blanks Matrix
        function generateFillInBlanksInterface() {
            const containerRoot = document.getElementById("fibArenaRoot");
            let renderHTMLBuffer = "";

            fillInBlanksDataAsset.forEach((item) => {
                renderHTMLBuffer += `
                    <div class="fill-card-box">
                        <div class="quiz-question"><span>${item.id}.</span> ${item.question}</div>
                        <div class="fill-row-alignment">
                            <input type="text" class="fill-input" placeholder="Type your answer...">
                            <button class="fill-reveal-btn" data-revealed="false" onclick="handleFillToggle(this, '${item.answer}')">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            containerRoot.innerHTML = renderHTMLBuffer;
        }

        // 2. Dynamic Injection Generator for Tap-To-Reveal Q&A Accordions
        function generateConceptualQAMatrixInterface() {
            const containerRoot = document.getElementById("qaMatrixRoot");
            let renderHTMLBuffer = "";

            conceptualQADataAsset.forEach((item) => {
                renderHTMLBuffer += `
                    <div class="qa-card" onclick="toggleAccordionMatrix(this)">
                        <div class="qa-question">
                            <div><span>Q${item.id}.</span> ${item.question}</div>
                            <i class="fa-solid fa-chevron-down qa-chevron"></i>
                        </div>
                        <div class="qa-answer">${item.answer}</div>
                    </div>
                `;
            });
            containerRoot.innerHTML = renderHTMLBuffer;
        }

        // 3. Dynamic Injection Generator for Writer Biography Profile Panel
        function generateWriterBiographyInterface() {
            const containerRoot = document.getElementById("writerProfileRoot");

            containerRoot.innerHTML = `
                <div class="writer-avatar-circle">
                    <i class="fa-solid fa-feather-pointed"></i>
                </div>
                <div class="writer-bio-text">
                    <h4>${writerBiographyDataAsset.name} <span style="font-weight:500; font-size:12.5px; color:var(--muted);">${writerBiographyDataAsset.timeline}</span></h4>
                    <p>${writerBiographyDataAsset.biographyText}</p>
                </div>
            `;
        }

        // ==========================================
        // SEPARATED INTERACTIVE QUIZ ENGINE ROUTERS
        // ==========================================

        // MCQ Controller Engine
        function renderMcqQuizArena() {
            const root = document.getElementById("mcqArenaRoot");
            if (mcqActiveIndex >= mcqQuizEngineData.length) {
                root.innerHTML = `
                    <div class="quiz-score-layout">
                        <i class="fa-solid fa-trophy"></i>
                        <h4>MCQs Completed!</h4>
                        <div style="font-size: 20px; font-weight:800; color:var(--primary); margin:8px 0;">${mcqScoreCount} / ${mcqQuizEngineData.length}</div>
                        <button class="quiz-next-action-btn" onclick="resetMcqEngine()" style="margin:10px auto 0 auto;"><i class="fa-solid fa-rotate-right"></i> Restart</button>
                    </div>`;
                return;
            }
            const data = mcqQuizEngineData[mcqActiveIndex];
            let opts = "";
            data.options.forEach((opt, idx) => {
                opts += `<button class="quiz-opt-btn" onclick="validateMcqSelection(this, ${idx})">${opt} <i class="fa-solid fa-circle-notch" style="opacity:0;"></i></button>`;
            });
            root.innerHTML = `
                <div class="quiz-meta-info"><span>MCQ MODE</span><span>Q: ${mcqActiveIndex + 1}/${mcqQuizEngineData.length}</span></div>
                <div class="quiz-question-text"><strong>${mcqActiveIndex + 1}.</strong> ${data.question}</div>
                <div class="quiz-options-wrapper">${opts}</div>
                <div class="quiz-action-footer">
                    <div class="quiz-feedback-banner" id="mcqFeedback"></div>
                    <button class="quiz-next-action-btn" id="mcqNextBtn" style="display:none;" onclick="advanceMcqStep()">Next <i class="fa-solid fa-arrow-right"></i></button>
                </div>`;
        }

        function validateMcqSelection(btn, idx) {
            const current = mcqQuizEngineData[mcqActiveIndex];
            const all = btn.parentElement.querySelectorAll(".quiz-opt-btn");
            all.forEach(b => b.style.pointerEvents = "none");

            if (idx === current.correctIndex) {
                btn.classList.add("correct-state");
                btn.querySelector("i").className = "fa-solid fa-circle-check";
                btn.querySelector("i").style.opacity = "1";
                document.getElementById("mcqFeedback").innerHTML = "<span style='color:var(--accent-green);'>Sahi Jawab!</span>";
                mcqScoreCount++;
            } else {
                btn.classList.add("wrong-state");
                btn.querySelector("i").className = "fa-solid fa-circle-xmark";
                btn.querySelector("i").style.opacity = "1";
                all[current.correctIndex].classList.add("correct-state");
                all[current.correctIndex].querySelector("i").className = "fa-solid fa-circle-check";
                all[current.correctIndex].querySelector("i").style.opacity = "1";
                document.getElementById("mcqFeedback").innerHTML = "<span style='color:var(--accent-red);'>Galat Jawab!</span>";
            }
            document.getElementById("mcqNextBtn").style.display = "flex";
        }

        function advanceMcqStep() { mcqActiveIndex++; renderMcqQuizArena(); }
        function resetMcqEngine() { mcqActiveIndex = 0; mcqScoreCount = 0; renderMcqQuizArena(); }

        // True / False Controller Engine
        function renderTfQuizArena() {
            const root = document.getElementById("tfArenaRoot");
            if (tfActiveIndex >= tfQuizEngineData.length) {
                root.innerHTML = `
                    <div class="quiz-score-layout">
                        <i class="fa-solid fa-flag-checkered"></i>
                        <h4>T/F Completed!</h4>
                        <div style="font-size: 20px; font-weight:800; color:var(--accent-orange); margin:8px 0;">${tfScoreCount} / ${tfQuizEngineData.length}</div>
                        <button class="quiz-next-action-btn" onclick="resetTfEngine()" style="margin:10px auto 0 auto; background:var(--accent-orange);"><i class="fa-solid fa-rotate-right"></i> Restart</button>
                    </div>`;
                return;
            }
            const data = tfQuizEngineData[tfActiveIndex];
            let opts = "";
            data.options.forEach((opt, idx) => {
                opts += `<button class="quiz-opt-btn" onclick="validateTfSelection(this, ${idx})">${opt} <i class="fa-solid fa-circle-notch" style="opacity:0;"></i></button>`;
            });
            root.innerHTML = `
                <div class="quiz-meta-info"><span>TRUE / FALSE</span><span>Q: ${tfActiveIndex + 1}/${tfQuizEngineData.length}</span></div>
                <div class="quiz-question-text"><strong>${tfActiveIndex + 1}.</strong> ${data.question}</div>
                <div class="quiz-options-wrapper" style="grid-template-columns: repeat(2, 1fr);">${opts}</div>
                <div class="quiz-action-footer">
                    <div class="quiz-feedback-banner" id="tfFeedback"></div>
                    <button class="quiz-next-action-btn" id="tfNextBtn" style="display:none; background:var(--accent-orange);" onclick="advanceTfStep()">Next <i class="fa-solid fa-arrow-right"></i></button>
                </div>`;
        }

        function validateTfSelection(btn, idx) {
            const current = tfQuizEngineData[tfActiveIndex];
            const all = btn.parentElement.querySelectorAll(".quiz-opt-btn");
            all.forEach(b => b.style.pointerEvents = "none");

            if (idx === current.correctIndex) {
                btn.classList.add("correct-state");
                btn.querySelector("i").className = "fa-solid fa-circle-check";
                btn.querySelector("i").style.opacity = "1";
                document.getElementById("tfFeedback").innerHTML = "<span style='color:var(--accent-green);'>Sahi!</span>";
                tfScoreCount++;
            } else {
                btn.classList.add("wrong-state");
                btn.querySelector("i").className = "fa-solid fa-circle-xmark";
                btn.querySelector("i").style.opacity = "1";
                all[current.correctIndex].classList.add("correct-state");
                all[current.correctIndex].querySelector("i").className = "fa-solid fa-circle-check";
                all[current.correctIndex].querySelector("i").style.opacity = "1";
                document.getElementById("tfFeedback").innerHTML = "<span style='color:var(--accent-red);'>Galat!</span>";
            }
            document.getElementById("tfNextBtn").style.display = "flex";
        }

        function advanceTfStep() { tfActiveIndex++; renderTfQuizArena(); }
        function resetTfEngine() { tfActiveIndex = 0; tfScoreCount = 0; renderTfQuizArena(); }

        // ==========================================
        // RUNTIME TOGGLE & INTERACTIVE UTILITY ACTIONS
        // ==========================================

        // Hide / Show Toggle Controller for Fill In Blanks
        function handleFillToggle(buttonRef, actualAnswerValue) {
            const baseRow = buttonRef.parentElement;
            const inputField = baseRow.querySelector(".fill-input");
            const icon = buttonRef.querySelector("i");
            const isRevealed = buttonRef.getAttribute("data-revealed") === "true";

            if (!isRevealed) {
                inputField.value = actualAnswerValue;
                inputField.style.borderColor = "var(--accent-green)";
                inputField.style.color = "var(--accent-green)";
                inputField.style.fontWeight = "700";
                buttonRef.setAttribute("data-revealed", "true");
                buttonRef.style.background = "var(--accent-green)";
                buttonRef.style.color = "#ffffff";
                icon.className = "fa-solid fa-eye-slash";
            } else {
                inputField.value = "";
                inputField.style.borderColor = "var(--line)";
                inputField.style.color = "var(--text)";
                inputField.style.fontWeight = "600";
                buttonRef.setAttribute("data-revealed", "false");
                buttonRef.style.background = "var(--primary-light)";
                buttonRef.style.color = "var(--primary)";
                icon.className = "fa-solid fa-eye";
            }
        }

        // Tap to Reveal Accordion logic for Q&A Matrix
        function toggleAccordionMatrix(cardElement) {
            const answerContainer = cardElement.querySelector(".qa-answer");
            const isAlreadyActive = cardElement.classList.contains("active-panel");

            if (isAlreadyActive) {
                answerContainer.style.display = "none";
                cardElement.classList.remove("active-panel");
            } else {
                answerContainer.style.display = "block";
                cardElement.classList.add("active-panel");
            }
        }

        // Chapter Summary Language Controls Switching Engine
        function switchSummaryLanguage(langKey, elementRef) {
            document.querySelectorAll(".lang-btn").forEach(btn => btn.classList.remove("active"));
            if (elementRef) elementRef.classList.add("active");
            document.getElementById("summaryViewPort").innerHTML = summaryDataAsset[langKey] || summaryDataAsset['en'];
        }

        // Global Theme Engine Synchronization Syncing Loop
        function applyThemeFromBrainHub() {
            const data = JSON.parse(localStorage.getItem("brainhub.app.v2") || "{}");
            const theme = data.theme || "light";
            document.documentElement.dataset.theme = theme;
            const metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.setAttribute("content", theme === "dark" ? "#121722" : "#ffffff");
        }

        // ==========================================
        // INITIALIZATION EVENTS INITIALIZER
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            // First run structural languages & system view setups
            switchSummaryLanguage('en', null);
            applyThemeFromBrainHub();

            // Invoke Dynamic Template Engine Injections 
            generateFillInBlanksInterface();
            generateConceptualQAMatrixInterface();
            generateWriterBiographyInterface();

            // Render Dynamic Sequential Arenas
            renderMcqQuizArena();
            renderTfQuizArena();
        });

        window.addEventListener("storage", (e) => {
            if (e.key === "brainhub.app.v2") applyThemeFromBrainHub();
        });
        setInterval(applyThemeFromBrainHub, 500);
    </script>
